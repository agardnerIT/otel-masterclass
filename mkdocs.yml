site_name: OpenTelemetry Masterclass
site_description: A hands-on OpenTelemetry workshop with Python and Dynatrace
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.footer
    - content.code.annotate
    - content.tabs.link
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Setup: setup.md
  - Concepts: concepts.md
  - Generate:
    - "Lab 01: Auto instrumentation": labs/01-auto-instrumentation.md
    - "Lab 02: Auto instrumentation expanded": labs/02-auto-expanded.md
    - "Lab 03: Manual instrumentation": labs/03-manual-instrumentation.md
    - "Lab 04: OTel Injector (discussion)": labs/04-injector.md
  - Collect and process:
    - "Lab 05: Collector basics": labs/05-collector-basics.md
    - "Lab 06: Processors": labs/06-processors.md
    - "Lab 07: Custom collector": labs/07-ocb.md
  - Standardise:
    - "Lab 08: Semantic conventions": labs/08-semantic-conventions.md
    - "Lab 09: Weaver": labs/09-weaver.md
  - Control plane:
    - "Lab 10: OpAMP": labs/10-opamp.md
    - "Lab 11: Bindplane (discussion)": labs/11-bindplane.md
  - Facilitator guide: facilitator.md
  - Next steps: next-steps.md
  - Contributing:
    - Lab page template: contributing-lab-template.md
    - Original brief: notes/brief.md
