# Exercise: the same collector, with an extra receiver for apps (OTLP) and all three signals.
receivers:
  file_log:
    include: [/logs/live.log]
    start_at: beginning
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp_http/dynatrace:
    endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
  debug:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [file_log, otlp]
      exporters: [otlp_http/dynatrace, debug]
    traces:
      receivers: [otlp]
      exporters: [otlp_http/dynatrace, debug]
    metrics:
      receivers: [otlp]
      exporters: [otlp_http/dynatrace, debug]
