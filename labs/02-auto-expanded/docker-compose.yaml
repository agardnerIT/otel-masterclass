# Default: send spans to Dynatrace. Run with: --env-file ../../.env
# (DT_ENDPOINT and DT_API_TOKEN come from the .env file in the repo root.)
x-otel-env: &otel-env
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: ${DT_ENDPOINT:-}/api/v2/otlp
  OTEL_EXPORTER_OTLP_HEADERS: Authorization=Api-Token ${DT_API_TOKEN:-}

services:
  frontend:
    build: ./frontend
    ports:
      - "9000:8000"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: frontend-lab02
      BACKEND_URL: http://backend:8001
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "9001:8001"
    environment:
        <<: *otel-env
        OTEL_SERVICE_NAME: backend-lab02
        INVENTORY_URL: http://inventory:8002
  inventory:
    build: ./inventory
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: inventory-lab02
