# Lab 06 starter: all processors are defined, none is used yet. Edit the "processors:" list in the pipeline.
receivers:
  file_log:
    include: [/logs/sample.log]
    start_at: beginning

processors:
  # Drop: health checks are noise.
  filter/health:
    log_conditions:
      - 'IsMatch(log.body, ".*GET /health.*")'
  # Drop: DEBUG lines are low value in production.
  filter/low_value:
    log_conditions:
      - 'IsMatch(log.body, "^DEBUG.*")'
  # Drop: remove the whole line (stage 4a, the blunt tool).
  filter/personal_info:
    log_conditions:
      - 'IsMatch(log.body, ".*[pP]assword.*")'
  # Mask: keep the line, hide only the email (stage 4b, the precise tool).
  transform/mask_email:
    log_statements:
      - replace_pattern(log.body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***@***")
  # Collapse: identical lines in a 10 second window become one record with a count.
  log_dedup:
    interval: 10s
    log_count_attribute: log_duplicates

exporters:
  otlp_http/dynatrace:
    endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
  debug:
    verbosity: detailed

service:
  pipelines:
    logs:
      receivers: [file_log]
      processors: [filter/health, filter/low_value, log_dedup, transform/mask_email]
      exporters: [otlp_http/dynatrace, debug]
