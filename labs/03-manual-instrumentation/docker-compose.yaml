# Default: send traces, metrics and logs to Dynatrace. Run with: --env-file ../../.env
# The backend is the STARTER code. Add docker-compose.solution.yaml to run the solution.
x-otel-env: &otel-env
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # Dynatrace needs delta temporality for counters and histograms.
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${DT_ENDPOINT:-}/api/v2/otlp
  OTEL_EXPORTER_OTLP_HEADERS: Authorization=Api-Token ${DT_API_TOKEN:-}

services:
  frontend:
    build: ./frontend
    ports:
      - "9000:8000"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: frontend-lab03
      BACKEND_URL: http://backend:8001
    depends_on:
      - backend

  backend:
    build: ./starter/backend
    ports:
      - "9001:8001"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: backend-lab03
